<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Florence · Italy</title>
  <style>
    :root {
      --accent: #E26245;
      --accent-light: #F6DDD2;
      --accent-dark: #B94F37;
    }
  </style>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/animations.css">
  <script>
    const a = sessionStorage.getItem('accent');
    if (a) {
      document.documentElement.style.setProperty('--accent', a);
      document.documentElement.style.setProperty('--accent-light', sessionStorage.getItem('accent-light'));
      document.documentElement.style.setProperty('--accent-dark', sessionStorage.getItem('accent-dark'));
    }
  </script>

</head>
<body>
   <a class="feed-back" href="../index.html"><span class="back-arrow">«&#xFE0E;</span> Trip overview</a>
  <div class="feed-hero">
    <h1>Florence</h1>
    <div class="feed-hero-date">
      <p>April 2017</p>
    </div>
  </div>
  <div class="wave"><p>&nbsp</p></div> 
 

  
  <div class="feed-content">
    <div class="feed-dashed"><div class="feed-dashed-line"></div></div>
    <div class="photo-block">
       <img src="https://pub-27dfd4e7906e4c2bbdb0a236ec4a506f.r2.dev/italy/florence/08817661-A68C-4564-B86E-53709D030458.jpeg" alt="Florence">
      <div class="photo-caption">
        <div class="photo-location">Trevi Fountain</div>
        <p>Add a caption here.</p>
      </div>
    </div>
    
    <div class="feed-dashed"><div class="feed-dashed-line"></div></div>
    <div class="story-block">
      <div class="story-prompt">Remember when…</div>
      <p>Add a nice memory here. </p>
      <div class="story-date">April 24, 2018</div>
    </div>
    
    <div class="end-cap">
    <div class="feed-dashed"><div class="feed-dashed-line"></div></div>
      <p class="end-label"> ❣&#xFE0E; </br> 
      la fine</p>
    </div>
  </div>

<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });

  document.querySelectorAll('.photo-block, .story-block, .end-cap')
    .forEach(el => observer.observe(el));
</script>



</body>
</html>
