<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Italy</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
</head>
<body>
  <div id="app"></div>
  <script>
    fetch('data.json')
      .then(r => r.json())
      .then(data => {
        document.documentElement.style.setProperty('--accent', data.accent);
        document.documentElement.style.setProperty('--accent-light', data['accent-light']);
        document.documentElement.style.setProperty('--accent-dark', data['accent-dark']);
        sessionStorage.setItem('accent', data.accent);
        sessionStorage.setItem('accent-light', data['accent-light']);
        sessionStorage.setItem('accent-dark', data['accent-dark']);

        const tripsHTML = data.trips.map(trip =>
          `<div class="date-separator">
            <div class="date-pin">❣&#xFE0E;</div>
            <h3>${trip.date}</h3>
            <p>with ${trip.who}</p>
          </div>
          <div class="city-list">
          
        ${trip.cities.map(city => {
        const cover = city.hero?.length
          ? city.hero[Math.floor(Math.random() * city.hero.length)]
          : city.cover;
        return `
          <div class="dashed-line"></div>
          <a class="city-card" href="${city.slug}/index.html">
            <img src="${cover}" alt="${city.name}">
            <div class="city-card-footer">
              <span class="city-name">${city.name}</span>
              <span class="city-arrow">✈&#xFE0E;</span>
            </div>
          </a>`;
      }).join('')}
      </div>`
      ).join('');

        document.getElementById('app').innerHTML = `
          <div class="cover-hero">
            <h1>${data.country}</h1>
            <p class="onBG">${data.trips.length} trip${data.trips.length > 1 ? 's' : ''}</p>
          </div>
          <div class="timeline">${tripsHTML}</div>
        `;
      });
  </script>
</body>
</html>
