<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Italy</title>
  <style>
    :root {
      --accent: #E26245;
      --accent-light: #F6DDD2;
      --accent-dark: #B94F37;
    }
  </style>
  <link rel="stylesheet" href="../css/style.css">
  <script>
    sessionStorage.setItem('accent', '#E26245');
    sessionStorage.setItem('accent-light', '#F6DDD2');
    sessionStorage.setItem('accent-dark', '#B94F37');
  </script>
</head>
<body>
  <div class="cover-hero">
    <h1>Italy</h1>
    <p class="onBG">1 trip</p>
  </div>

  <div class="timeline">
    <div class="date-separator">
      <div class="date-pin">❣&#xFE0E;</div>
      <h3>April 2017</h3>
      <p>with Jason, Heath, & Rebecca</p>
    </div>

    <div class="dashed-line"></div>
    <a class="city-card" href="milan/index.html">
      <img src="photos/IMG_6109.JPG" alt="Milan">
      <div class="city-card-footer">
        <span class="city-name">Milan</span>
        <span class="city-arrow">✈&#xFE0E;</span>
      </div>
    </a>
    <div class="dashed-line"></div>
    <a class="city-card" href="florence/index.html">
      <img src="photos/IMG_6119.JPG" alt="Florence">
      <div class="city-card-footer">
        <span class="city-name">Florence</span>
        <span class="city-arrow">✈&#xFE0E;</span>
      </div>
    </a>
    <div class="dashed-line"></div>
    <a class="city-card" href="rome/">
      <img src="photos/IMG_6174.JPG" alt="Rome">
      <div class="city-card-footer">
        <span class="city-name">Rome</span>
        <span class="city-arrow">✈&#xFE0E;</span>
      </div>
    </a>
  </div>
</body>
</html>
