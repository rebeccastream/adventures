<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Italy</title>
  <style>
    :root {
      --accent: #D44720;
      --accent-light: #E9752E;
      --accent-dark: #B83A15;
    }
  </style>
  <link rel="stylesheet" href="../style.css">
  <script>
    sessionStorage.setItem('accent', '#D44720');
    sessionStorage.setItem('accent-light', '#E9752E');
    sessionStorage.setItem('accent-dark', '#B83A15');
  </script>
</head>
<body>
  <div class="cover-hero">
    <div class="cover-blob1"></div>
    <div class="cover-blob2"></div>
    <h1>Italy</h1>
    <small>1 trip ✈ April 2018 </small>
  </div>

  <div class="timeline">
    <div class="date-separator">
      <div class="date-pin">❣</div>
      <h3>April 2018</h3>
      <small>with Jason, Heath, & Rebecca</small>
    </div>

    <div class="dashed-line"></div>
    <a class="city-card" href="milan/">
      <img src="photos/IMG_6109.JPG" alt="Milan">
      <div class="city-card-footer">
        <span class="city-name">Milan</span>
        <span class="city-arrow">✈</span>
      </div>
    </a>
    <div class="dashed-line"></div>
    <a class="city-card" href="florence/">
      <img src="photos/IMG_6119.JPG" alt="Florence">
      <div class="city-card-footer">
        <span class="city-name">Florence</span>
        <span class="city-arrow">↣</span>
      </div>
    </a>
    <div class="dashed-line"></div>
    <a class="city-card" href="rome/">
      <img src="photos/IMG_6174.JPG" alt="Rome">
      <div class="city-card-footer">
        <span class="city-name">Rome</span>
        <span class="city-arrow">↣</span>
      </div>
    </a>
  </div>
</body>
</html>
